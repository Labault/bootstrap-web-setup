name: PHP

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP quality
    runs-on: ubuntu-latest
    # Throwaway database for the tests, matching the Symfony recipe defaults
    # (.env / compose.yaml). Change the image tag and serverVersion together.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: "!ChangeMe!"
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Overrides .env; Doctrine appends the _test suffix in the test env.
      DATABASE_URL: "postgresql://app:!ChangeMe!@127.0.0.1:5432/app?serverVersion=18&charset=utf8"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: pdo_pgsql
          tools: composer

      - name: Validate composer.json
        # --no-check-publish: apps (type: project) are not published to Packagist,
        # so name/description are not required.
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP-CS-Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Rector (dry-run)
        run: vendor/bin/rector process --dry-run --no-progress-bar

      - name: Prepare test database
        # Skipped for projects without Doctrine; migrations only when installed.
        run: |
          if [ ! -f bin/console ]; then
            echo "No bin/console: skipping database setup."
            exit 0
          fi
          commands="$(php bin/console list --raw --env=test)"
          if ! grep -qE '^doctrine:database:create( |$)' <<<"$commands"; then
            echo "DoctrineBundle not installed: skipping database setup."
            exit 0
          fi
          php bin/console doctrine:database:create --env=test --if-not-exists
          if grep -qE '^doctrine:migrations:migrate( |$)' <<<"$commands"; then
            php bin/console doctrine:migrations:migrate --env=test --no-interaction --allow-no-migration
          fi

      - name: Tests
        run: |
          if [ -f vendor/bin/pest ]; then
            vendor/bin/pest
          else
            vendor/bin/phpunit
          fi
